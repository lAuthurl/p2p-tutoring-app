# -------------------------------
# User
# -------------------------------
type User @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: private, operations: [read] },
    { allow: public, operations: [read] }
  ])
{
  id: ID!
  username: String!
  email: String!
  phoneNumber: String
  profilePicture: String
  deviceToken: String
  isEmailVerified: Boolean
  isProfileActive: Boolean
  role: String
  verificationStatus: String
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
  skills: [String]
  about: String
  profileCompleted: Boolean @default(value: "false")

  # Relationships
  bookings: [Booking] @hasMany(indexName: "byUser", fields: ["id"])
  bookingItems: [BookingItem] @hasMany(indexName: "byUser", fields: ["id"])
  reviews: [Review] @hasMany(indexName: "byUser", fields: ["id"]) 
}

# -------------------------------
# Tutor
# -------------------------------
type Tutor @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: private, operations: [read] },
    { allow: public, operations: [read] }
  ])
{
  id: ID!
  name: String!
  email: String!
  image: String
  skills: [String]
  about: String

  # Relationships
  tutoringSessions: [TutoringSession] @hasMany(indexName: "byTutor", fields: ["id"])
  reviews: [Review] @hasMany(indexName: "byTutor", fields: ["id"])
}

# -------------------------------
# Subject
# -------------------------------
type Subject @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: private, operations: [read] },
    { allow: public, operations: [read] }
  ])
{
  id: ID!
  name: String!
  description: String
  icon: String
  thumbnail: String
  isFeatured: Boolean

  # Relationship with index on child
  tutoringSessions: [TutoringSession] @hasMany(indexName: "bySubject", fields: ["id"])
}

# -------------------------------
# TutoringSession
# -------------------------------
type TutoringSession @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: private, operations: [read] },   # ✅ any signed-in Cognito user can list ALL sessions
    { allow: public, operations: [read] }
  ])
{
  id: ID!

  tutorId: ID! @index(name: "byTutor")
  subjectId: ID! @index(name: "bySubject")

  # Relationships
  tutor: Tutor @belongsTo(fields: ["tutorId"])
  subject: Subject @belongsTo(fields: ["subjectId"])
  sessionAttributes: [SessionAttribute] @hasMany(indexName: "bySession", fields: ["id"])
  bookings: [Booking] @hasMany(indexName: "bySession", fields: ["id"])
  reviews: [Review] @hasMany(indexName: "bySession", fields: ["id"])

  # Session details
  title: String!
  description: String
  thumbnail: String
  images: [String]
  pricePerSession: Float
  isFeatured: Boolean
  hasPaid: Boolean @default(value: "false")
  maxStudents: Int
  enrolledCount: Int @default(value: "0")

  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

# -------------------------------
# Booking
# -------------------------------
type Booking @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: public, operations: [read] }
  ])
{
  id: ID!

  userId: ID! @index(name: "byUser")
  user: User @belongsTo(fields: ["userId"])

  sessionId: ID! @index(name: "bySession")

  bookingItems: [BookingItem] @hasMany(indexName: "byBooking", fields: ["id"])

  selectedOptions: AWSJSON

  totalPrice: Float
  status: String

  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

# -------------------------------
# BookingItem
# -------------------------------
type BookingItem @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: public, operations: [read] }
  ])
{
  id: ID!

  userId: ID! @index(name: "byUser")
  user: User @belongsTo(fields: ["userId"])

  bookingId: ID! @index(name: "byBooking", sortKeyFields: ["createdAt"])
  booking: Booking @belongsTo(fields: ["bookingId"])

  sessionId: ID
  tutorId: ID

  bookingDate: AWSDateTime
  timeSlot: String
  price: Float
  quantity: Int
  negotiatedPrice: Float
  applyDiscount: Boolean
  isPhysical: Boolean
  serviceTitle: String
  serviceImage: String
  providerName: String
  providerImage: String

  selectedAttributes: AWSJSON

  hasPaid: Boolean @default(value: "false")

  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

# -------------------------------
# SessionAttribute
# -------------------------------
type SessionAttribute @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: private, operations: [read] },
    { allow: public, operations: [read] }
  ])
{
  id: ID!

  tutorId: ID!
  sessionId: ID! @index(name: "bySession")
  name: String!
  values: [String]

  session: TutoringSession @belongsTo(fields: ["sessionId"])

  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

# -------------------------------
# Review
# -------------------------------
type Review @model
  @auth(rules: [
    { allow: owner, operations: [create, update, delete] },
    { allow: private, operations: [read] },   # ✅ fixes "Not Authorized to access user/tutor on type Review"
    { allow: public, operations: [read] }
  ]) {
  id: ID!

  userId: ID! @index(name: "byUser", queryField: "listReviewsByUser")
  user: User @belongsTo(fields: ["userId"])

  sessionId: ID! @index(name: "bySession", queryField: "listReviewsBySession")

  tutorId: ID! @index(name: "byTutor", queryField: "listReviewsByTutor")
  tutor: Tutor @belongsTo(fields: ["tutorId"])

  rating: Float!
  comment: String

  createdAt: AWSDateTime
}

# -------------------------------
# Chat Message
# -------------------------------
type ChatMessage @model
  @auth(rules: [
    { allow: owner, operations: [create, delete] },
    { allow: private, operations: [read] },   # ✅ any signed-in user can read messages in their sessions
    { allow: public, operations: [read] }
  ])
{
  id: ID!
  sessionId: ID! @index(name: "bySession", queryField: "listChatMessagesBySession")
  senderId: ID!
  senderName: String
  text: String
  isVoice: Boolean
  audioUrl: String
  createdAt: AWSDateTime
}

# -------------------------------
# UserFavorite
# -------------------------------
type UserFavorite @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: public, operations: [read] }
  ]) {
  id: ID!
  userId: ID! @index(name: "byUser", queryField: "listUserFavoritesByUser")
  sessionId: ID!
 
  createdAt: AWSDateTime
}

# -------------------------------
# UserSessionPayment
# -------------------------------
type UserSessionPayment @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: public, operations: [read] }
  ])
{
  id: ID!
  userId: ID! @index(name: "byUser", queryField: "listUserSessionPaymentsByUser")
  sessionId: ID! @index(name: "bySession", queryField: "listUserSessionPaymentsBySession")
  hasPaid: Boolean! @default(value: "false")
  paidAt: AWSDateTime
  amountPaid: Float
  reference: String
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

# -------------------------------
# Call Session - for Agora calls
# -------------------------------
type CallSession @model
  @auth(rules: [
    { allow: owner, operations: [create, read, update, delete] },
    { allow: private, operations: [read, update] },  # ✅ callee can read + update status
    { allow: public, operations: [] }
  ])
{
  id: ID!
  sessionId: ID! @index(name: "bySession", queryField: "listCallSessionsBySession")  # ✅ queryable by sessionId
  callerId: ID!  @index(name: "byCaller",  queryField: "listCallSessionsByCaller")   # ✅ caller can find their calls
  calleeId: ID!  @index(name: "byCallee",  queryField: "listCallSessionsByCallee")   # ✅ callee can find incoming calls
  status: CallStatus!
  isVideo: Boolean!
  agoraChannel: String!
  createdAt: AWSDateTime
  updatedAt: AWSDateTime   # ✅ needed to track status changes
}

enum CallStatus {
  RINGING
  ACTIVE
  ENDED
}